<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postcard Template Maker</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<div class="app">
  <h1>Postcard Template Maker</h1>
  <div class="sub">3120 × 2500 px · Photo area 3120 × 2080 px · 3-color palette</div>

  <div class="grid">
    <div class="panel">
      <label>1. 上傳照片</label>
      <div class="drop" id="drop">點擊選擇照片<br><small>也可以直接拖曳圖片進來</small></div>
      <input id="file" type="file" accept="image/*">

      <label>2. 圖片放入方式</label>
      <select id="fit">
        <option value="contain">完整放入（不裁切）</option>
        <option value="cover">填滿照片區（會裁切）</option>
      </select>

      <label>3. 縮放</label>
      <input id="zoom" type="range" min="0.5" max="2.5" step="0.01" value="1">

      <label>4. 水平位置</label>
      <input id="x" type="range" min="-1" max="1" step="0.001" value="0">

      <label>5. 垂直位置</label>
      <input id="y" type="range" min="-1" max="1" step="0.001" value="0">

      <label>6. 色塊</label>
      <div class="swatches" id="swatches"></div>

      <button class="primary" id="download">下載 3120 × 2500 PNG</button>

      <div class="info">
        明信片：3120 × 2500<br>
        照片區：3120 × 2080（3:2）<br>
        色塊：112 × 112<br>
        色塊間距：37 px<br>
        預設色塊會從照片自動抓取代表色。
      </div>
    </div>

    <div class="preview-wrap">
      <canvas id="canvas" width="3120" height="2500"></canvas>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
